function setLang(lang){
  const d = I18N[lang] || I18N.es;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(d[k]!=null) el.textContent=d[k]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ const k=el.getAttribute("data-i18n-html"); if(d[k]!=null) el.innerHTML=d[k]; });
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b=> b.classList.toggle("on", b.getAttribute("data-lang")===lang));
  try{ localStorage.setItem("tentakl_lang", lang); }catch(e){}
  if(_SITE.title[lang]) document.title = _SITE.title[lang];
  renderBlog(lang);
}

const SB_URL="https://nnghwfmqdengqzugxpgd.supabase.co";

let _blogByLang={}, _blogStatic=null, _SITE={title:{},desc:{},tema:"ninguno"};
function _sbGet(path){
  return fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}})
    .then(r=> r.ok ? r.json() : Promise.reject(r.status));
}
function _esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function renderBlog(lang){
  const cont=document.getElementById("blog-list"); if(!cont) return;
  if(_blogStatic===null) _blogStatic=cont.innerHTML;
  const posts=_blogByLang[lang];
  if(posts && posts.length){
    cont.innerHTML = posts.map(p=>{
      const tag = p.tag ? '<span class="post-tag">'+_esc(p.tag)+'</span> ' : '';
      const img = p.imagen_url ? '<img src="'+encodeURI(p.imagen_url)+'" alt="" style="max-width:100%;border-radius:10px;margin:.6rem 0;">' : '';
      return '<details class="post"><summary>'+tag+_esc(p.titulo)+'</summary><div class="post-body">'+img+(p.cuerpo||"")+'</div></details>';
    }).join("");
  } else {
    cont.innerHTML=_blogStatic;
    const d=I18N[lang]||I18N.es;
    cont.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(d[k]!=null) el.textContent=d[k];});
    cont.querySelectorAll("[data-i18n-html]").forEach(el=>{const k=el.getAttribute("data-i18n-html"); if(d[k]!=null) el.innerHTML=d[k];});
  }
}
